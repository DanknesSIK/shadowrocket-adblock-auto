# 凤歌日用配置 v1.1 | Shadowrocket 原生完整主配置
# 用法：配置 > 添加配置 > 粘贴本文件 Raw 地址 > 下载 > 使用配置。
# 节点仍由首页订阅管理；本文件不含节点、订阅密钥或证书。
# 启用前停用旧分流/去广告模块，全局路由选「配置」。
# 参考：LOWERTOP/Shadowrocket、Johnshall 懒人分组；规则来源 blackmatrix7。
# 远程规则锁定到通过仓库检查的版本；每日检查更新，导入地址保持不变。
# 仅完成静态与规则样例验证；实际稳定性、内存、解锁能力须在设备上验证。

[General]
update-url = https://raw.githubusercontent.com/DanknesSIK/shadowrocket-adblock-auto/main/profiles/FengGe.conf
# 单一加密 DNS，加系统回退；局域网名称在 Host 中交给系统解析。
dns-server = https://dns.alidns.com/dns-query
fallback-dns-server = system
dns-direct-system = false
dns-direct-fallback-proxy = false
private-ip-answer = true
# 将本地 Hosts 映射应用到 Tailscale 等代理策略。
use-local-host-item-for-proxy = true
ipv6 = false
prefer-ipv6 = false
icmp-auto-reply = true
skip-proxy = localhost,*.local,*.lan,*.home.arpa,captive.apple.com
# 不排除 100.64.0.0/10；也不旁路整个 RFC1918，保留精确 Tailscale 子网规则的可能。
tun-excluded-routes = 127.0.0.0/8,169.254.0.0/16,224.0.0.0/4,255.255.255.255/32,ff02::fb/128
udp-policy-not-supported-behaviour = REJECT
# 代理 QUIC 回退 TCP，国内直连 QUIC 保留；不伪造 STUN，不全局封锁 UDP。
block-quic = all-proxy
always-reject-url-rewrite = false

[Proxy Group]
# ChatGPT 自动排除名称带香港标识的节点；PikPak 自动在全部有效节点中选择。
ChatGPT自动 = url-test,policy-regex-filter=(?i)^(?!.*(?:香港|港|hong[ -]?kong|(?:^|[^a-z])hk(?=$|[^a-z])|🇭🇰|剩余|流量|到期|过期|套餐|官网|网址|订阅|公告)).*$,url=http://www.gstatic.com/generate_204,interval=1800,tolerance=150,timeout=5
PikPak自动 = url-test,policy-regex-filter=^(?!.*(?:剩余|流量|到期|过期|套餐|官网|网址|订阅|公告)).*$,url=http://www.gstatic.com/generate_204,interval=1800,tolerance=150,timeout=5
# PROXY 指向首页选中的节点。先选可用节点，再按需要为各业务固定出口。
节点选择 = select,PROXY,手动选择,自动选择,故障转移,香港节点,台湾节点,日本节点,新加坡节点,美国节点,韩国节点,policy-select-name=PROXY
手动选择 = select,PROXY,policy-select-name=PROXY,policy-regex-filter=^(?!.*(?:剩余|流量|到期|过期|套餐|官网|网址|订阅|公告)).*$
# 两个自动组均为可选项；测试周期 30 分钟，测速不代表实际下载带宽。
自动选择 = url-test,policy-regex-filter=^(?!.*(?:剩余|流量|到期|过期|套餐|官网|网址|订阅|公告)).*$,url=http://www.gstatic.com/generate_204,interval=1800,tolerance=150,timeout=5
故障转移 = fallback,policy-regex-filter=^(?!.*(?:剩余|流量|到期|过期|套餐|官网|网址|订阅|公告)).*$,url=http://www.gstatic.com/generate_204,interval=1800,timeout=5
# 地区组使用手动选择；无当地节点时不要选该组，名称筛选不验证实际出口国家。
香港节点 = select,policy-regex-filter=(?i)(香港|港|hong[ -]?kong|(?:^|[^a-z])hk(?:$|[^a-z])|🇭🇰)
台湾节点 = select,policy-regex-filter=(?i)(台湾|台灣|台北|新北|taiwan|(?:^|[^a-z])tw(?:$|[^a-z])|🇹🇼)
日本节点 = select,policy-regex-filter=(?i)(日本|东京|東京|大阪|japan|tokyo|osaka|(?:^|[^a-z])jp(?:$|[^a-z])|🇯🇵)
新加坡节点 = select,policy-regex-filter=(?i)(新加坡|狮城|獅城|singapore|(?:^|[^a-z])sg(?:$|[^a-z])|🇸🇬)
美国节点 = select,policy-regex-filter=(?i)(美国|美國|洛杉矶|洛杉磯|西雅图|西雅圖|纽约|紐約|united[ -]?states|america|(?:^|[^a-z])usa?(?:$|[^a-z])|🇺🇸)
韩国节点 = select,policy-regex-filter=(?i)(韩国|韓國|首尔|首爾|korea|seoul|(?:^|[^a-z])kr(?:$|[^a-z])|🇰🇷)
# AI、Telegram 独立于自动选择；默认首页节点，建议改成经过验证的固定节点。
AI服务 = select,PROXY,手动选择,美国节点,新加坡节点,日本节点,台湾节点,policy-select-name=PROXY
Telegram = select,PROXY,手动选择,香港节点,新加坡节点,日本节点,美国节点,policy-select-name=PROXY
YouTube = select,节点选择,手动选择,香港节点,台湾节点,日本节点,新加坡节点,美国节点,policy-select-name=节点选择
国际影视 = select,节点选择,手动选择,香港节点,台湾节点,日本节点,新加坡节点,美国节点,policy-select-name=节点选择
Spotify = select,节点选择,手动选择,DIRECT,policy-select-name=节点选择
TikTok = select,PROXY,手动选择,日本节点,新加坡节点,美国节点,policy-select-name=PROXY
Google = select,节点选择,手动选择,日本节点,新加坡节点,美国节点,policy-select-name=节点选择
海外开发 = select,节点选择,手动选择,DIRECT,policy-select-name=节点选择
苹果服务 = select,DIRECT,节点选择,手动选择,policy-select-name=DIRECT
微软服务 = select,DIRECT,节点选择,手动选择,policy-select-name=DIRECT
游戏平台 = select,节点选择,手动选择,DIRECT,policy-select-name=节点选择
国内服务 = select,DIRECT,节点选择,policy-select-name=DIRECT
# DIRECT 临时放行广告域名，但不会卸载已编译的广告域名集。
广告拦截 = select,REJECT,DIRECT,policy-select-name=REJECT
漏网之鱼 = select,节点选择,DIRECT,policy-select-name=节点选择
# 仅用于 ts.net 域名；不会自动开启或认证内置 Tailscale。
Hermes内网 = select,TAILSCALE,DIRECT,policy-select-name=TAILSCALE

[Rule]
# 管理域名固定走内置 Tailscale；小程序 api.staru.icu 继续按普通公网规则处理。
DOMAIN,hermes.staru.icu,TAILSCALE
DOMAIN,secure.staru.icu,TAILSCALE
IP-CIDR,100.123.3.89/32,TAILSCALE,no-resolve

# PikPak API、网站和已收录下载域名均使用全节点自动选择。
DOMAIN-SUFFIX,mypikpak.com,PikPak自动
