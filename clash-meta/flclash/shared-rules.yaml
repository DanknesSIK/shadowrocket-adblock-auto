# Merge these entries into an existing profile.
proxy-groups:
  - name: PikPak-Auto
    type: url-test
    include-all-proxies: true
    use: [subscription]
    exclude-filter: '(?i)^(DIRECT|REJECT(-DROP)?|PASS|COMPATIBLE)$|剩余流量|套餐到期|距离下次重置|重置时间|^网址[:：]|^回家页[:：]'
    url: https://mypikpak.com/en-US/faq
    expected-status: 200
    interval: 1800
    tolerance: 150
    lazy: false
    empty-fallback: REJECT

  - name: ChatGPT-NonHK
    type: url-test
    include-all-proxies: true
    use: [subscription]
    exclude-filter: '(?i)^(DIRECT|REJECT(-DROP)?|PASS|COMPATIBLE)$|港|hong[ _-]*kong|(^|[^a-z])hkg?([^a-z]|$)|🇭🇰|剩余|流量|到期|过期|套餐|官网|网址|订阅|公告'
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    interval: 300
    tolerance: 30
    lazy: true
    empty-fallback: REJECT

rule-providers:
  shared-pikpak:
    type: http
    behavior: classical
    format: text
    path: ./ruleset/noir-pikpak.list
    url: https://raw.githubusercontent.com/DanknesSIK/shadowrocket-adblock-auto/main/clash-meta/find-n2/mirror/pikpak.list
    interval: 86400

  shared-ths:
    type: http
    behavior: classical
    format: text
    path: ./ruleset/shared-ths.list
    url: https://raw.githubusercontent.com/DanknesSIK/shadowrocket-adblock-auto/main/clash-meta/shared/ths-direct.list
    interval: 86400

  shared-chatgpt:
    type: http
    behavior: classical
    format: text
    path: ./ruleset/shared-chatgpt.list
    url: https://raw.githubusercontent.com/DanknesSIK/shadowrocket-adblock-auto/main/clash-meta/shared/chatgpt.list
    interval: 86400

rules:
  - RULE-SET,shared-chatgpt,ChatGPT-NonHK
  - RULE-SET,shared-ths,DIRECT
  - DOMAIN,adx.ads.heytapmobi.com,REJECT
  - RULE-SET,shared-pikpak,PikPak-Auto
