name: Build Shadowrocket AdBlock Module
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'  # UTC; Beijing 11:17
  push:
    paths:
      - 'build.py'
      - 'sources.json'
      - 'tests/**'
      - '.github/workflows/build.yml'
permissions:
  contents: write
concurrency:
  group: shadowrocket-adblock-auto
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Merge and validate upstream rules
        run: python build.py
      - name: Commit updated module
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/AllApps-Auto.sgmodule dist/build-report.json
          if git diff --staged --quiet; then
            echo "No upstream changes."
          else
            git commit -m "chore: rebuild adblock module"
            git push
          fi
